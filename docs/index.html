<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recruiter Portal</title>
<meta name="description" content="AI Recruiting Copilot: open roles with shortlists, the candidate pipeline, and the search bot's test score.">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5d6673; --line: #e3e6ea;
    --accent: #2b59c3; --accent-soft: #e8eefb; --good: #1d7a46; --good-soft: #e3f4ea;
    --bad: #b3261e; --bad-soft: #fbe9e7; --warn: #8a5a00; --warn-soft: #fdf1d8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111418; --card: #1a1e24; --text: #e7eaee; --muted: #9aa3ae; --line: #2b3139;
      --accent: #7fa2ff; --accent-soft: #1f2a44; --good: #5fd08f; --good-soft: #17301f;
      --bad: #ff8a80; --bad-soft: #3a1c1a; --warn: #f2c063; --warn-soft: #3a2d12;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--card); border-bottom: 1px solid var(--line); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; padding: 18px 0 8px; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  nav { display: flex; gap: 4px; overflow-x: auto; }
  nav button { background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted);
               font: inherit; font-weight: 600; padding: 10px 12px; cursor: pointer; white-space: nowrap; }
  nav button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  main { padding: 20px 0 48px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .stat b { display: block; font-size: 24px; }
  .stat span { color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 17px; margin: 0 0 2px; }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 12px; }
  .chip { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; border-top: 0; }
  .score { font-weight: 700; font-variant-numeric: tabular-nums; }
  .cv { color: var(--muted); font-size: 12px; }
  .stage { display: inline-block; border-radius: 6px; padding: 1px 8px; font-size: 12px; font-weight: 600;
           background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .stage.replied, .stage.interview, .stage.placed { background: var(--good-soft); color: var(--good); }
  .stage.rejected { background: var(--bad-soft); color: var(--bad); }
  .stage.shortlisted { background: var(--line); color: var(--muted); }
  details summary { cursor: pointer; color: var(--accent); font-size: 13px; margin-top: 8px; }
  details p { white-space: pre-wrap; font-size: 14px; }
  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .col { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .col h3 { font-size: 14px; margin: 0 0 8px; display: flex; justify-content: space-between; }
  .col h3 span { color: var(--muted); font-weight: 400; }
  .person { border-top: 1px solid var(--line); padding: 8px 0; font-size: 14px; }
  .person small { display: block; color: var(--muted); }
  .empty { color: var(--muted); font-size: 13px; }
  .scorebox { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .big { font-size: 40px; font-weight: 800; line-height: 1; }
  .result { font-weight: 700; white-space: nowrap; }
  .pass { color: var(--good); } .fail { color: var(--bad); } .pending { color: var(--warn); }
  .note { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
  .names { font-size: 14px; }
  @media (max-width: 640px) {
    .hide-sm { display: none; }
    th, td { padding: 8px 4px; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>Recruiter Portal</h1>
      <span class="sub" id="updated">Loading…</span>
    </div>
    <nav role="tablist">
      <button role="tab" aria-selected="true" data-tab="roles">Open roles</button>
      <button role="tab" aria-selected="false" data-tab="pipeline">Pipeline</button>
      <button role="tab" aria-selected="false" data-tab="test">Bot test</button>
    </nav>
  </div>
</header>
<main class="wrap">
  <div id="roles"></div>
  <div id="pipeline" hidden></div>
  <div id="test" hidden></div>
</main>
<script>
// The portal holds NO keys. It asks an n8n webhook, and n8n reads the database with its own key.
const DATA_URL = 'https://n8ndemo.remotelyx.com/webhook/sg-portal-data';

const STAGES = [
  ['shortlisted', 'Shortlisted'], ['approved', 'Approved'], ['contacted', 'Outreach sent'],
  ['replied', 'Replied'], ['interview', 'Interview'], ['placed', 'Placed'], ['rejected', 'Not a fit']
];
const stageLabel = s => (STAGES.find(x => x[0] === s) || [s, s])[1];

const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = n => String(n).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();

// Tabs
document.querySelectorAll('nav button').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-selected', b === btn));
  ['roles', 'pipeline', 'test'].forEach(id => document.getElementById(id).hidden = id !== btn.dataset.tab);
  try { localStorage.setItem('tab', btn.dataset.tab); } catch (e) {}
}));
try { const t = localStorage.getItem('tab'); if (t) document.querySelector(`nav button[data-tab="${t}"]`)?.click(); } catch (e) {}

function renderRoles(d) {
  const s = d.stats || {};
  let html = `<div class="stats">
    <div class="stat"><b>${(d.roles || []).length}</b><span>open roles</span></div>
    <div class="stat"><b>${s.candidates ?? '–'}</b><span>candidates</span></div>
    <div class="stat"><b>${s.cv_files ?? '–'}</b><span>CV files processed</span></div>
    <div class="stat"><b>${s.flagged ?? '–'}</b><span>CVs flagged unreadable</span></div>
  </div>`;
  if (!(d.roles || []).length) html += '<p class="empty">No approved roles yet.</p>';
  for (const r of d.roles || []) {
    const list = r.shortlist || [];
    html += `<section class="card">
      <h2>#${esc(r.id)} ${esc(r.title)}</h2>
      <div class="meta">${esc(r.client)}</div>
      <div class="chips">${(r.must_haves || []).map(m => `<span class="chip">${esc(m)}</span>`).join('')}</div>
      ${list.length ? `<table>
        <thead><tr><th>Candidate</th><th>Score</th><th class="hide-sm">Why</th><th>Stage</th></tr></thead>
        <tbody>${list.map(c => `<tr>
          <td>${esc(c.name)}<div class="cv">📄 ${esc(c.cv)}</div></td>
          <td class="score">${esc(c.score)}</td>
          <td class="hide-sm">${esc(c.reason)}</td>
          <td><span class="stage ${esc(c.stage)}">${esc(stageLabel(c.stage))}</span></td>
        </tr>`).join('')}</tbody></table>`
      : '<p class="empty">No shortlist yet. Ask the Slack bot about this role to create one.</p>'}
      ${r.job_description ? `<details><summary>Job description</summary><p>${esc(r.job_description)}</p></details>` : ''}
    </section>`;
  }
  document.getElementById('roles').innerHTML = html;
}

function renderPipeline(d) {
  const rows = d.pipeline || [];
  const cols = STAGES.map(([key, label]) => {
    const people = rows.filter(p => p.stage === key);
    return `<div class="col"><h3>${esc(label)} <span>${people.length}</span></h3>
      ${people.length ? people.map(p => `<div class="person">${esc(p.name)}
        <small>Role #${esc(p.role_id)} · ${esc(p.role)}</small><small>📄 ${esc(p.cv)}</small></div>`).join('')
        : '<div class="empty">Nobody</div>'}</div>`;
  }).join('');
  document.getElementById('pipeline').innerHTML =
    `<p class="meta">Stages are synced from the GoHighLevel candidate pipeline every minute.</p><div class="board">${cols}</div>`;
}

function grade(t) {
  if (!t.bot) return 'pending';
  const got = (t.bot.names || []).map(norm).sort();
  if (norm(t.expected) === 'no match') return got.length === 0 ? 'pass' : 'fail';
  const want = t.expected.split(';').map(norm).sort();
  return JSON.stringify(got) === JSON.stringify(want) ? 'pass' : 'fail';
}

function renderTest(d) {
  const tests = d.tests || [];
  const results = tests.map(grade);
  const passed = results.filter(r => r === 'pass').length;
  const pending = results.filter(r => r === 'pending').length;
  const label = { pass: '✓ Pass', fail: '✗ Fail', pending: 'Not asked yet' };
  document.getElementById('test').innerHTML = `
    <section class="card scorebox">
      <div class="big">${passed}/${tests.length}</div>
      <div><b>Search bot score</b><div class="meta">Each question was asked to the Slack bot. It passes only if the bot
        returns exactly the right people (or correctly says there is no good match).</div></div>
    </section>
    ${pending ? `<p class="note">${pending} question${pending > 1 ? 's have' : ' has'} not been asked in Slack yet.</p>` : ''}
    <section class="card"><table>
      <thead><tr><th>#</th><th>Question</th><th>Right answer</th><th>Bot answered</th><th>Result</th></tr></thead>
      <tbody>${tests.map((t, i) => `<tr>
        <td>${i + 1}</td>
        <td>${esc(t.question)}</td>
        <td class="names">${esc(t.expected)}</td>
        <td class="names">${!t.bot ? '–' : (t.bot.names || []).length ? esc(t.bot.names.join('; ')) : 'no match'}</td>
        <td class="result ${results[i]}">${label[results[i]]}</td>
      </tr>`).join('')}</tbody></table></section>`;
}

async function load() {
  try {
    const res = await fetch(DATA_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();
    renderRoles(d); renderPipeline(d); renderTest(d);
    document.getElementById('updated').textContent = 'Live data · updated ' + new Date(d.generated_at || Date.now()).toLocaleString();
  } catch (e) {
    document.getElementById('updated').textContent = 'Could not load data';
    document.getElementById('roles').innerHTML =
      `<p class="note">The data service did not answer (${esc(e.message)}). The n8n "5 - Portal data" workflow must be published,
       and the Supabase project must not be paused.</p>`;
  }
}
load();
</script>
</body>
</html>
